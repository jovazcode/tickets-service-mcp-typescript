version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@modelcontextprotocol/*"
    ignore:
      # Types must match the minimum supported runtime (engines.node >= 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
